<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1f14"/>
      <stop offset="50%" stop-color="#09140c"/>
      <stop offset="100%" stop-color="#020804"/>
    </linearGradient>
    <linearGradient id="snekGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#26ff8c"/>
      <stop offset="50%" stop-color="#00e575"/>
      <stop offset="100%" stop-color="#00a854"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff85"/>
      <stop offset="100%" stop-color="#008040"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Circle with Neon Border -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" stroke="url(#ringGrad)" stroke-width="12" />
  
  <!-- Subtle Grid Circle -->
  <circle cx="256" cy="256" r="215" fill="none" stroke="#00e575" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.4" />

  <!-- S-Curved Snake Body -->
  <g filter="url(#glow)">
    <!-- Snake Main Body Silhouette S-shape -->
    <path d="M 330 140 
             C 330 90, 256 70, 200 100 
             C 140 135, 150 210, 230 240 
             C 320 275, 330 350, 270 400 
             C 210 450, 140 410, 130 360 
             C 125 330, 145 320, 155 330 
             C 170 350, 205 385, 260 365 
             C 295 340, 280 295, 220 270 
             C 130 230, 120 145, 190 95 
             C 260 50, 355 80, 360 140
             Z" 
          fill="url(#snekGrad)" />

    <!-- Head and Crown of the SNEK -->
    <path d="M 320 130 
             C 340 110, 395 105, 415 130 
             C 435 155, 415 190, 375 195 
             C 340 200, 310 165, 320 130 Z" 
          fill="url(#snekGrad)" />
          
    <!-- Snake Eye -->
    <ellipse cx="380" cy="142" rx="9" ry="12" fill="#ffffff" />
    <ellipse cx="383" cy="142" rx="4" ry="11" fill="#09140c" />
    <circle cx="384" cy="138" r="2" fill="#00ff85" />

    <!-- Forked Red Tongue -->
    <path d="M 415 150 
             L 445 150 
             L 460 135 
             M 445 150 
             L 460 165" 
          stroke="#ff3366" stroke-width="4.5" stroke-linecap="round" fill="none" />

    <!-- Scales Highlights -->
    <path d="M 220 120 Q 240 115 260 125" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.3" fill="none" />
    <path d="M 200 165 Q 220 160 240 170" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.3" fill="none" />
    <path d="M 270 310 Q 290 315 305 330" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.3" fill="none" />
    <path d="M 220 355 Q 240 365 260 360" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.3" fill="none" />
  </g>

  <!-- Taiwan Badge / Text Sub-Emblem -->
  <rect x="156" y="420" width="200" height="42" rx="21" fill="#09140c" stroke="#00e575" stroke-width="2.5" />
  <text x="256" y="448" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="22" fill="#00e575" letter-spacing="3">SNEK 台灣</text>
</svg>
